#:schema ../../stranger-quarkdown/squarkdown/src/config/schema.json
# :schema https://sup2point0.github.io/stranger-quarkdown/schemas/v4.5

[project]
name = "Integrity"
github = "Sup2point0/integrity"

[errors]
strict = true
on-error = "warn"
file-already-exists = "overwrite"
link-broken = "mark-broken"
link-inactive = "link-to-github"

[paths]
site = "site/"
sources = [
	".",
	".squarkdown/content/",
	"docs/",
	"scriptures/",
	"fun/",
	"desmos/",
]

[out]
file-name = "+page.svx"
folder = "src/routes/(root)/"
site-data-path = "src/data/site.json"
shorter-fields = false

[format]
inject-head = true
preserve-heading = false
preserve-comments = true
externalise-links = true

[assets]
folder = "assets/"
site-assets-folder = "assets/site/"

[fonts]
queries = [
	"Geologica:slnt,wght,CRSV@-12..0,100..900,1",
	"Crimson+Pro:ital,wght@0,200..900;1,200..900",
	"Fira+Mono:wght@400",
]
